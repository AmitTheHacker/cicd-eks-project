apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-first
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-first
  template:
    metadata:
      labels:
        app: cicd-first
    spec:
      containers:
        - name: cicd-first
          image: 716189571315.dkr.ecr.us-east-1.amazonaws.com/cicd-first:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # 🟢 HEALTH CHECKS (Probes)
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: cicd-first
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: cicd-first
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000