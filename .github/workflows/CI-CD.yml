name: Production CI/CD Pipeline (Helm Enabled)

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cicd-first-tf
  EKS_CLUSTER: zidd-tf-cluster
  ECR_REGISTRY: 716189571315.dkr.ecr.us-east-1.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::716189571315:role/GitHubActions-Terraform-Role

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # ==========================================
  # CI Stage: Build, Scan & Push
  # ==========================================
  ci:
    name: 🏗️ Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Short Commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: 🕵️ Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-CI-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🐳 Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🔨 Build Docker Image
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}
          docker build -t $IMAGE .
          docker tag $IMAGE $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: 🛡️ Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.short_sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: 📤 Push Docker Image to ECR
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}
          docker push $IMAGE
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ==========================================
  # CD Stage: Helm Deploy to EKS
  # ==========================================
  cd:
    name: 🚀 Continuous Deployment (Helm)
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short Commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: 🔐 Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-CD-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ☸️ Configure kubectl for Amazon EKS
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      # 🟢 TASK 2: Helm Upgrade/Install
      - name: 🎯 Deploy / Upgrade via Helm Chart
        run: |
          echo "☸️ Deploying with Helm..."
          helm upgrade --install cicd-first ./helm/cicd-first \
            --set image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set image.tag=${{ steps.vars.outputs.short_sha }} \
            --namespace default \
            --wait \
            --timeout 3m0s

      # 🟢 TASK 3: Helm Rollback on Failure
      - name: 🚦 Verify Deployment & Helm Rollback
        if: failure()
        run: |
          echo "❌ Helm Deployment Failed! Rolling back to previous Helm revision..."
          helm rollback cicd-first 0 --namespace default

      - name: 📊 Generate Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Helm Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "* **Cluster Name:** \`${{ env.EKS_CLUSTER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Helm Release:** \`cicd-first\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Deployed Tag:** \`${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Deployment Status:** ${{ job.status == 'success' && '🟢 SUCCESS' || '🔴 FAILED' }}" >> $GITHUB_STEP_SUMMARY
