name: Multi-Env GitOps CI/CD (Cosign + ArgoCD)

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cicd-first-tf
  ECR_REGISTRY: 716189571315.dkr.ecr.us-east-1.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::716189571315:role/GitHubActions-Terraform-Role

permissions:
  id-token: write
  contents: write # ← Required to allow GitHub Actions to commit tag changes back to git

jobs:
  # ==========================================
  # 1. CI: Build, Scan, Sign with Cosign & Push
  # ==========================================
  ci:
    name: 🏗️ CI - Build, Sign & Push
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-CI-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Tag
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.short_sha }} .
          docker tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.short_sha }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.short_sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Push to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.short_sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      # 🛡️ COSIGN INTEGRATION: Install Cosign CLI
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      # 🛡️ COSIGN INTEGRATION: Digitally Sign the Docker Image
      - name: Sign Docker Image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.short_sha }}

  # ==========================================
  # 2. CD: GitOps Tag Update for Staging (Auto)
  # ==========================================
  deploy-staging:
    name: 🚀 GitOps Update - STAGING
    runs-on: ubuntu-latest
    needs: ci
    environment: staging

    steps:
      - uses: actions/checkout@v4

      # Automatically updates the image tag inside values-staging.yaml
      - name: Update Staging Image Tag
        run: |
          sed -i 's/tag: .*/tag: "${{ needs.ci.outputs.short_sha }}"/g' ./helm/cicd-first/values-staging.yaml

      # Commits the changes back to GitHub so ArgoCD can pull it
      - name: Commit & Push Changes to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com" # ← FIXED
          git add ./helm/cicd-first/values-staging.yaml
          git commit -m "gitops(staging): update image tag to ${{ needs.ci.outputs.short_sha }} [skip ci]"
          git push

  # ==========================================
  # 3. CD: GitOps Tag Update for Production (Manual Approval)
  # ==========================================
  deploy-production:
    name: 🚀 GitOps Update - PRODUCTION
    runs-on: ubuntu-latest
    needs: [ci, deploy-staging]
    environment: production # ← Manual Approval Gate remains here

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Fetch the latest changes pushed by the staging job
      - name: Pull Latest Git Changes
        run: git pull origin main

      # Automatically updates the image tag inside values-prod.yaml
      - name: Update Production Image Tag
        run: |
          sed -i 's/tag: .*/tag: "${{ needs.ci.outputs.short_sha }}"/g' ./helm/cicd-first/values-prod.yaml

      # Commits the production changes back to GitHub
      - name: Commit & Push Changes to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com" # ← FIXED
          git add ./helm/cicd-first/values-prod.yaml
          git commit -m "gitops(production): update image tag to ${{ needs.ci.outputs.short_sha }} [skip ci]"
          git push
