name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cicd-first
  EKS_CLUSTER: zidd-3
  ECR_REGISTRY: 716189571315.dkr.ecr.us-east-1.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::716189571315:role/GitHubActions-Enterprise-OIDC-Role

permissions:
  id-token: write
  contents: read
  actions: read 

jobs:

  # ==========================================
  # CI Stage: Build, Scan & Push
  # ==========================================
  ci:
    name: 🏗️ Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Short Commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 🟢 TASK 1: Secret Scanning
      - name: 🕵️ Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-CI-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🐳 Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🔨 Build Docker Image
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}
          docker build -t $IMAGE .
          docker tag $IMAGE $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 🟢 TASK 2: Trivy Strict Mode (Fail on CRITICAL vulnerabilities)
      - name: 🛡️ Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.short_sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: 📤 Push Docker Image to ECR
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}
          docker push $IMAGE
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ==========================================
  # CD Stage: Deploy to EKS & Rollback
  # ==========================================
  cd:
    name: 🚀 Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci
    environment: production      # 👈 TASK 4: Manual Approval Gate Environment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short Commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: 🔐 Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-CD-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ☸️ Configure kubectl for Amazon EKS
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: 🔄 Deploy / Update Image on EKS
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/cicd-first cicd-first=$IMAGE

      # 🟢 TASK 3: Automated Rollback on Failure
      - name: 🚦 Verify Rollout & Automated Rollback
        run: |
          if ! kubectl rollout status deployment/cicd-first --timeout=2m; then
            echo "❌ Deployment Failed! Rolling back to previous working version..."
            kubectl rollout undo deployment/cicd-first
            exit 1
          fi
          echo "✅ Deployment Successful!"

      # 🟢 TASK 5: Deployment Summary Report
      - name: 📊 Generate Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "* **Cluster Name:** \`${{ env.EKS_CLUSTER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **AWS Region:** \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Deployed Commit SHA:** \`${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Deployment Result:** ${{ job.status == 'success' && '🟢 SUCCESS' || '🔴 FAILED' }}" >> $GITHUB_STEP_SUMMARY