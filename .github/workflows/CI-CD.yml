name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cicd-first
  EKS_CLUSTER: zidd-3
  ECR_REGISTRY: 716189571315.dkr.ecr.us-east-1.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::716189571315:role/GitHubActions-Enterprise-OIDC-Role

permissions:
  id-token: write
  contents: read
  actions: read 

jobs:

  # ==========================================
  # CI Stage: Continuous Integration
  # ==========================================
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Short Commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # my Native OIDC Debugger (Never Fails)
      - name: Print OIDC Token Claims for Debugging
        run: |
          python3 -c "
          import os, json, base64, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          headers = {'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}
          req = urllib.request.Request(url, headers=headers)
          token = json.loads(urllib.request.urlopen(req).read())['value']
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.b64decode(payload))
          print('================ OIDC CLAIMS ================')
          print(json.dumps(claims, indent=2))
          print('=============================================')
          "

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-CI-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}
          docker build -t $IMAGE .

      # TASK 2: Trivy Strict Mode (exit-code: 1)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.short_sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to ECR
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}
          docker push $IMAGE

  # ==========================================
  # CD Stage: Continuous Deployment
  # ==========================================
  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short Commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-CD-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for Amazon EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Update Deployment Image on EKS
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}
          kubectl set image deployment/cicd-first cicd-first=$IMAGE || kubectl apply -f k8s/deployment.yml

      # TASK 3: Automated Rollback on Failure
      - name: Verify Kubernetes Deployment Rollout & Rollback
        run: |
          if ! kubectl rollout status deployment/cicd-first --timeout=2m; then
            echo "❌ Deployment Failed! Rolling back..."
            kubectl rollout undo deployment/cicd-first
            exit 1
          fi
          echo "✅ Deployment Successful!"