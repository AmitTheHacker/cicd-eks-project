name: CI-CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cicd-first
  EKS_CLUSTER: zidd-3
  ECR_REGISTRY: 716189571315.dkr.ecr.us-east-1.amazonaws.com
  # ⚠️ यहाँ आपके बनाए गए रोल का ARN इस्तेमाल हो रहा है:
  AWS_ROLE_ARN: arn:aws:iam::716189571315:role/GitHubActions-Enterprise-OIDC-Role

# ==========================================================
# ⚠️ Enterprise OIDC टोकन एक्सचेंज के लिए यह ब्लॉक डालना अनिवार्य है
# ==========================================================
permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================
  # CI - Continuous Integration
  # ==========================================
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------
      # Gitleaks - Secret Scanning (अब यह .gitignore की वजह से पास हो जाएगा)
      # ------------------------------------------
      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------
      # Configure AWS via Enterprise OIDC Role (No Keys Used!)
      # ------------------------------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------
      # Login to ECR
      # ------------------------------------------
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------
      # Build Docker Image
      # ------------------------------------------
      - name: Build Docker Image
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}
          docker build -t $IMAGE .

      # ------------------------------------------
      # Push Image to ECR
      # ------------------------------------------
      - name: Push Docker Image
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}
          docker push $IMAGE

  # ==========================================
  # CD - Continuous Deployment
  # ==========================================
  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------
      # Configure AWS via Enterprise OIDC Role (No Keys Used!)
      # ------------------------------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------
      # Configure kubectl
      # ------------------------------------------
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      # ------------------------------------------
      # Deploy to EKS
      # ------------------------------------------
      - name: Deploy to EKS
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}
          kubectl set image deployment/cicd-first cicd-first=$IMAGE

      # ------------------------------------------
      # Verify Deployment
      # ------------------------------------------
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/cicd-first --timeout=5m
