name: Multi-Env CI/CD (Staging + Production)

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cicd-first-tf
  EKS_CLUSTER: zidd-tf-cluster
  ECR_REGISTRY: 716189571315.dkr.ecr.us-east-1.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::716189571315:role/GitHubActions-Terraform-Role

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # ==========================================
  # 1. CI: Build + Scan + Push
  # ==========================================
  ci:
    name: 🏗️ CI - Build & Push
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-CI-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Tag
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}
          docker build -t $IMAGE .
          docker tag $IMAGE $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.short_sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Push to ECR
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.vars.outputs.short_sha }}
          docker push $IMAGE
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ==========================================
  # 2. Deploy to STAGING (Auto)
  # ==========================================
  deploy-staging:
    name: 🚀 Deploy to STAGING
    runs-on: ubuntu-latest
    needs: ci
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Helm Deploy STAGING
        run: |
          helm upgrade --install cicd-first-staging ./helm/cicd-first \
            -f ./helm/cicd-first/values-staging.yaml \
            --set image.tag=${{ needs.ci.outputs.short_sha }} \
            --namespace staging \
            --create-namespace \
            --wait \
            --timeout 3m

      - name: Staging Summary
        run: |
          echo "### 🟢 STAGING Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: \`staging\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image Tag: \`${{ needs.ci.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Release: \`cicd-first-staging\`" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # 3. Deploy to PRODUCTION (Manual Approval)
  # ==========================================
  deploy-production:
    name: 🚀 Deploy to PRODUCTION
    runs-on: ubuntu-latest
    needs: [ci, deploy-staging]
    environment: production # ← Approval Gate yahan hai

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Helm Deploy PRODUCTION
        run: |
          helm upgrade --install cicd-first-prod ./helm/cicd-first \
            -f ./helm/cicd-first/values-prod.yaml \
            --set image.tag=${{ needs.ci.outputs.short_sha }} \
            --namespace production \
            --create-namespace \
            --wait \
            --timeout 3m

      - name: Production Summary
        if: always()
        run: |
          echo "### 🟢 PRODUCTION Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: \`production\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image Tag: \`${{ needs.ci.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Release: \`cicd-first-prod\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
