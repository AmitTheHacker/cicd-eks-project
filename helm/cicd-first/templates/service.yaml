apiVersion: v1
kind: Service
metadata:
  name: {{ include "cicd-first.fullname" . }}
  labels:
    {{- include "cicd-first.labels" . | nindent 4 }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "cicd-first.selectorLabels" . | nindent 4 }}