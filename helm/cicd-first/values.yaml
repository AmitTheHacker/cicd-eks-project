# Default values for cicd-first chart.

replicaCount: 2

image:
  repository: 716189571315.dkr.ecr.us-east-1.amazonaws.com/cicd-first-tf
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 5
  readiness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
